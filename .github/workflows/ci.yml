name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy src/qexec
      - name: Test
        run: python -m pytest --cov=qexec --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Slow tests
        run: python -m pytest -m slow

  reproduce-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Experiments (quick)
        run: make experiments-quick
      - name: Figures from quick results
        run: make figures-quick
      - name: Every paper figure has a producer
        run: make check-figures
      - name: Paper numbers up to date; manuscript sources consistent
        run: make check-paper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-reproduction
          path: build/quick/
